# Publishes a GitHub release whenever the version in pyproject.toml changes on main.
#
# To release: bump `version` in pyproject.toml and `__version__` in
# celestron_aux/__init__.py, add a section for it to CHANGELOG.md, and push.
# The tests must pass first. A version that already has a release is skipped,
# so other pushes are harmless.

name: Release

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Read the version
        id: version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          package=$(python -c 'import celestron_aux; print(celestron_aux.__version__)')
          if [ "$version" != "$package" ]; then
            echo "::error::pyproject.toml says $version but celestron_aux/__init__.py says $package"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "v${{ steps.version.outputs.version }} is already released; nothing to do."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the wheel and source archive
        if: steps.existing.outputs.released == 'false'
        run: |
          python -m pip install build
          python -m build

      - name: Publish the release
        if: steps.existing.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Release notes: the CHANGELOG.md section for this version.
          awk -v heading="## $VERSION" '
            $0 == heading || index($0, heading " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "celestron-aux $VERSION" \
            --notes-file notes.md
