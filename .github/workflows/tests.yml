# Runs the test suite on every push and pull request, on Windows, macOS and Linux.

name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint and type check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python -m pyflakes celestron_aux tests
          python -m mypy celestron_aux

      - name: Run the tests
        shell: bash
        run: |
          python -m pytest -q -rf --tb=short 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Show what failed in the run's annotations, without opening the log.
            grep -E "^(FAILED|ERROR)" pytest.log | head -20 | while IFS= read -r line; do
              echo "::error title=Failed test::${line:0:400}"
            done
            grep -E "^E  " pytest.log | head -12 | while IFS= read -r line; do
              echo "::error title=Assertion::${line:0:300}"
            done
          fi
          exit "$status"
