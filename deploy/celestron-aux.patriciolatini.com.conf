# celestron-aux: celestron-aux.patriciolatini.com
# The project's static web page (site/ in the repository). Name-based virtual host:
# it only answers for this name, so the other sites on the server are not affected.
#
# Install (Debian/Ubuntu layout), done by scripts/deploy-site.sh --setup:
#   mkdir -p /var/www/celestron-aux.patriciolatini.com
#   cp celestron-aux.patriciolatini.com.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/celestron-aux.patriciolatini.com.conf /etc/nginx/sites-enabled/
#   certbot certonly --webroot -w /var/www/celestron-aux.patriciolatini.com -d celestron-aux.patriciolatini.com
#   nginx -t && systemctl reload nginx

# ---------- HTTP: certificate challenges, everything else to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name celestron-aux.patriciolatini.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/celestron-aux.patriciolatini.com;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name celestron-aux.patriciolatini.com;

    ssl_certificate     /etc/letsencrypt/live/celestron-aux.patriciolatini.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/celestron-aux.patriciolatini.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:celestron_aux_ssl:10m;
    ssl_session_timeout 1d;

    root /var/www/celestron-aux.patriciolatini.com;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/celestron-aux.patriciolatini.com.access.log;
    error_log  /var/log/nginx/celestron-aux.patriciolatini.com.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css image/svg+xml;

    error_page 404 /404.html;

    # The page loads nothing from other sites, so the policy can be strict.
    set $csp "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";

    location / {
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Hidden files are never served.
    location ~ /\.(?!well-known/) { return 404; }
}
