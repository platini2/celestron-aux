# celestron-aux.patriciolatini.com: the site's old name, now only a redirect to
# auxbus.patriciolatini.com, so links to the old address keep working.
#
# Replaces the old site's file on the server (same name), once the new site is up:
#   cp celestron-aux.patriciolatini.com.conf /etc/nginx/sites-available/
#   nginx -t && systemctl reload nginx
# It uses the old name's certificate; certbot keeps renewing it as before.

server {
    listen 80;
    listen [::]:80;
    server_name celestron-aux.patriciolatini.com;
    return 301 https://auxbus.patriciolatini.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name celestron-aux.patriciolatini.com;
    ssl_certificate     /etc/letsencrypt/live/celestron-aux.patriciolatini.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/celestron-aux.patriciolatini.com/privkey.pem;
    return 301 https://auxbus.patriciolatini.com$request_uri;
}
